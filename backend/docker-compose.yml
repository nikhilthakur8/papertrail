version: '3.8'

services:
  backend:
    build: .
    env_file:
      - .env
    ports:
      - "${PORT:-5100}:5100"
    volumes:
      - .:/app
      - /app/node_modules
    restart: always

  # Optional: MongoDB service if you want to run database locally in a container
  # mongodb:
  #   image: mongo:latest
  #   ports:
  #     - "27017:27017"
  #   volumes:
  #     - mongo-data:/data/db

volumes:
  mongo-data:
